name: Publish documentation to Github Pages

on:
  push:
    branches:
      - 'release'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-upload:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Antora
        run: npm install
      - name: Generate Documentation Site
        run: npx antora antora-playbook.yml

      - name: Set up JDK Temurin 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Generate Demo web export
        run: ./gradlew :Demo:composeCompatibilityBrowserDistribution
      - name: Copy Demo web export to site directory
        run: cp -r Demo/build/dist/composeWebCompatibility/productionExecutable build/site/Demo

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
